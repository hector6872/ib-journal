name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Code style and linting with Ruff
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: |
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check backend/ scripts/ tests/

  # Job 2: Static type check with Mypy
  type-check:
    name: Core Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Tools
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[all]"

      - name: Run Type Check (mypy)
        run: |
          mypy backend scripts tests

  # Job 3: Security & dependency vulnerability audit
  audit:
    name: Dependency Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Audit Tools
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[all]"

      - name: Dependency Vulnerability Scan (pip-audit)
        run: |
          # Audits Python dependencies against known CVE databases
          pip-audit --desc on

  # Job 4: Automated unit test suite & frontend JS validation across Python versions
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[all]"

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Set up Node.js for Frontend JS Syntax Validation
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Validate Frontend JavaScript Syntax
        run: |
          for f in frontend/js/*.js; do
            node --check "$f"
          done
